{{- if not .Values.secrets.existingSecret }}
{{- $name := include "platform.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Values supplied in `secrets.*` win; otherwise keep what is already in the cluster; otherwise generate. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" (dict "root" . "c" "secrets") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  mariadb-root-password: {{ .Values.secrets.mariadbRootPassword | default (get $existing "mariadb-root-password" | b64dec) | default (randAlphaNum 28) | b64enc | quote }}
  mariadb-password: {{ .Values.secrets.mariadbPassword | default (get $existing "mariadb-password" | b64dec) | default (randAlphaNum 28) | b64enc | quote }}
  wp-admin-password: {{ .Values.secrets.wpAdminPassword | default (get $existing "wp-admin-password" | b64dec) | default (randAlphaNum 20) | b64enc | quote }}
  woo-consumer-key: {{ get $existing "woo-consumer-key" | b64dec | default (printf "ck_%s" (randAlphaNum 40)) | b64enc | quote }}
  woo-consumer-secret: {{ get $existing "woo-consumer-secret" | b64dec | default (printf "cs_%s" (randAlphaNum 40)) | b64enc | quote }}
  woo-mcp-token: {{ get $existing "woo-mcp-token" | b64dec | default (randAlphaNum 40) | b64enc | quote }}
  notes-mcp-token: {{ get $existing "notes-mcp-token" | b64dec | default (randAlphaNum 40) | b64enc | quote }}
  utils-mcp-token: {{ get $existing "utils-mcp-token" | b64dec | default (randAlphaNum 40) | b64enc | quote }}
  gateway-encryption-key: {{ .Values.secrets.encryptionKey | default (get $existing "gateway-encryption-key" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  gateway-admin-password: {{ .Values.secrets.adminPassword | default (get $existing "gateway-admin-password" | b64dec) | default (randAlphaNum 20) | b64enc | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | default (get $existing "llm-api-key" | b64dec) | b64enc | quote }}
{{- end }}
