{{- if eq .Values.mode "platform" }}
{{- range $kind := list "notes" "utils" }}
{{- $cfg := index $.Values.demoServers $kind }}
{{- if $cfg.enabled }}
{{- $c := dict "root" $ "c" (printf "%s-mcp" $kind) }}
{{- $name := include "platform.cname" $c }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.selector" $c | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" $c | nindent 8 }}
    spec:
      {{- include "platform.pullSecrets" $ | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $kind }}-mcp
          image: {{ include "platform.image" (dict "root" $ "img" $.Values.demoServers.image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- include "platform.containerSecurity" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: KIND
              value: {{ $kind }}
            - name: MCP_AUTH_TOKEN
              {{- include "platform.secretRef" (dict "root" $ "key" (printf "%s-mcp-token" $kind)) | nindent 14 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $.Values.demoServers.resources | nindent 12 }}
{{- end }}
{{- end }}

{{- end }}
