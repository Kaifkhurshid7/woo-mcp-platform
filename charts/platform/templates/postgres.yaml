{{- if and (eq .Values.mode "platform") .Values.postgres.enabled }}
{{- /* Shared state for the gateway (users, keys, sessions, servers, audit). Required to run more than one gateway replica. */}}
{{- $c := dict "root" . "c" "postgres" }}
{{- $name := include "platform.cname" $c }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.selector" $c | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" $c | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # the "postgres" user of the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository (toString .Values.postgres.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_PASSWORD
              {{- include "platform.secretRef" (dict "root" . "key" "postgres-password") | nindent 14 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "platform.selector" $c | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "platform.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
